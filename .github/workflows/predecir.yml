name: predecir

# Corrida manual. Las programadas las hace `vigilante.yml`: el cron de GitHub
# solo disparaba este workflow 3-4 veces al dia.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del slate (AAAA-MM-DD, hora del Este). Vacio = hoy."
        required: false
      registrar:
        description: "Actualizar la prediccion oficial. Edgebook manda false."
        required: false
        default: "false"

concurrency:
  group: predecir
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predecir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - name: Proyectar el slate
        run: |
          args=""
          if [ -n "${{ inputs.fecha }}" ]; then args="--fecha ${{ inputs.fecha }}"; fi
          if [ "${{ inputs.registrar }}" != "true" ]; then args="$args --no-registrar"; fi
          modelo-nba predecir $args
      - name: Publicar
        run: |
          git config user.name "modelo-nba[bot]"
          git config user.email "modelo-nba@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Proyecciones $(TZ=America/New_York date +%F) $(date -u +%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
