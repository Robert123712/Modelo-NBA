name: predecir

# Corrida manual. Las programadas las hace `vigilante.yml`: el cron de GitHub
# solo disparaba este workflow 3-4 veces al dia.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del slate (AAAA-MM-DD, hora del Este). Vacio = hoy."
        required: false
      registrar:
        description: "Actualizar la prediccion oficial. Edgebook manda false."
        required: false
        default: "false"

concurrency:
  group: predecir
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predecir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - name: Proyectar el slate
        run: |
          args=""
          if [ -n "${{ inputs.fecha }}" ]; then args="--fecha ${{ inputs.fecha }}"; fi
          if [ "${{ inputs.registrar }}" != "true" ]; then args="$args --no-registrar"; fi
          modelo-nba predecir $args
      - name: Publicar
        run: |
          git config user.name "modelo-nba[bot]"
          git config user.email "modelo-nba@users.noreply.github.com"
          # La misma publicacion que el vigilante: si choca con otra corrida,
          # pone sus datos encima de lo mas nuevo en vez de quedarse trabada.
          python -c "from modelo_nba.vigilante import publicar; publicar()"
