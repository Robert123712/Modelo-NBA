[project]
name = "modelo-nba"
version = "0.1.0"
description = "Simulador de partidos NBA que publica proyecciones para Edgebook"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modelo-nba = "modelo_nba.cli:main"

[tool.setuptools.packages.find]
include = ["modelo_nba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
